    <ellipse cx="12" cy="6" rx="2.2" ry="3.5" fill="#9B8EA9" opacity="0.7" transform="rotate(180 12 12)"/>
    <ellipse cx="12" cy="6" rx="2.2" ry="3.5" fill="#9B8EA9" opacity="0.7" transform="rotate(240 12 12)"/>
